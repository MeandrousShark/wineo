name: Release

# Tag filters are globs, so v* only narrows things down. The real check is
# scripts/release-guard.sh, which runs in the guard job and again right
# before publish creates the Release.
#
# A manual run is a dry run: check, build, and every verify job on the chosen
# ref, with the Cargo.toml version, and never publish.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  guard:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The checkout can replace an annotated tag with a lightweight one
      # that points at the same commit, which would fail the guard's
      # annotated check on every run. Fetch the real tag object again.
      - name: Fetch the tag object
        if: github.event_name == 'push'
        run: |
          git fetch --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "+${GITHUB_REF}:${GITHUB_REF}"

      # Only the steps are skipped on a dry run: a skipped job would skip
      # everything that needs it, however far down the chain.
      - name: Release guard
        if: github.event_name == 'push'
        run: scripts/release-guard.sh

  check:
    needs: guard
    uses: ./.github/workflows/ci.yml

  build:
    needs: check
    runs-on: ubuntu-latest
    # Built on Ubuntu 22.04 (glibc 2.35) so the binaries run there and on
    # anything newer, whatever label GitHub's runners carry later.
    container: ubuntu:22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      # Only a C compiler and pkg-config: the windowing and graphics crates
      # load their libraries at runtime, so no -dev packages are needed.
      # liblzma-dev is left out on purpose, so lzma-sys compiles its own
      # copy and the binary has no liblzma runtime dependency.
      # xz-utils is for the vendored source tarball.
      - name: Install build packages
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y \
            build-essential ca-certificates curl git pkg-config xz-utils

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A dry run has no tag, so it uses the version the binaries will report.
      - name: Set the version
        id: version
        run: |
          if [[ $GITHUB_EVENT_NAME == push ]]; then
            version=${GITHUB_REF_NAME#v}
          else
            version=$(awk -F '"' '
              /^\[workspace\.package\]$/ { in_workspace = 1; next }
              /^\[/ { in_workspace = 0 }
              in_workspace && /^version = / { print $2; exit }
            ' Cargo.toml)
          fi
          if [[ -z $version ]]; then
            echo "::error::no version found"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
            sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build
        run: cargo build --release --locked -p wineo-cli -p wineo-gui

      - name: Pack
        run: |
          scripts/pack-tarball.sh "$VERSION" target/release dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tarball
          path: dist/*.tar.gz
          if-no-files-found: error

      # nfpm is pinned and checked against its SHA-256 in fetch-nfpm.sh.
      - name: Pack the deb and rpm
        run: |
          scripts/fetch-nfpm.sh "$RUNNER_TEMP/nfpm"
          NFPM=$RUNNER_TEMP/nfpm/nfpm scripts/pack-packages.sh "$VERSION" target/release dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-packages
          path: |
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

      # The checkout is owned by another user than the one in this container,
      # so git refuses to read it until the directory is marked safe. The
      # default shallow checkout already has the commit being built.
      - name: Pack the vendored source
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          scripts/pack-vendored.sh "$VERSION" "$GITHUB_SHA" dist

      # An empty CARGO_HOME, so the metadata can only resolve from the
      # vendored sources.
      - name: Check the vendored source is complete
        run: |
          check=$(mktemp -d)
          mkdir "$check/cargo-home"
          tar -xJf "dist/wineo-$VERSION-vendored.tar.xz" -C "$check"
          cd "$check/wineo-$VERSION"
          CARGO_HOME=$check/cargo-home cargo metadata --format-version 1 --frozen >/dev/null
          cd "$GITHUB_WORKSPACE"
          rm -rf "${check:?}"

      - name: Write the checksums
        run: scripts/write-checksums.sh dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-source
          path: dist/*-vendored.tar.xz
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-checksums
          path: dist/SHA256SUMS
          if-no-files-found: error

  verify:
    needs: build
    runs-on: ubuntu-latest
    # A fresh image with only the documented runtime packages, so a library
    # the build machine had but a user won't is caught here.
    container: ubuntu:22.04
    env:
      VERSION: ${{ needs.build.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-tarball
          path: dist

      # The runtime list comes from the README's marked block, so the
      # README and this job can't disagree. xvfb and xauth run the GUI and
      # binutils provides objdump; they are test tools, not runtime needs.
      # Recommended packages stay out so a missing library isn't hidden.
      - name: Install runtime packages and test tools
        run: |
          # Assigned first so a failing script stops the step.
          list=$(scripts/readme-runtime-packages.sh)
          mapfile -t runtime <<<"$list"
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y \
            "${runtime[@]}" xvfb xauth binutils

      - name: Unpack
        run: |
          tar -xzf "dist/wineo-$VERSION-x86_64-linux.tar.gz" -C dist

      - name: Linked libraries are all found
        run: |
          for bin in wineo wineo-gui; do
            out=$(ldd "dist/wineo-$VERSION-x86_64-linux/usr/bin/$bin")
            echo "$out"
            if grep -q 'not found' <<<"$out"; then
              echo "::error::$bin links a library that is not installed"
              exit 1
            fi
          done

      - name: No glibc newer than 2.35
        run: |
          highest=$(
            for bin in wineo wineo-gui; do
              objdump -T "dist/wineo-$VERSION-x86_64-linux/usr/bin/$bin"
            done | grep -o 'GLIBC_[0-9][0-9.]*' | sed 's/^GLIBC_//' | sort -Vu | tail -n 1
          )
          echo "highest glibc symbol version: ${highest:-none}"
          if [[ -n $highest && $(printf '%s\n' "$highest" 2.35 | sort -V | tail -n 1) != 2.35 ]]; then
            echo "::error::a binary needs glibc $highest, newer than 2.35"
            exit 1
          fi

      - name: wineo --version runs
        run: |
          out=$("dist/wineo-$VERSION-x86_64-linux/usr/bin/wineo" --version)
          echo "$out"
          # The whole line, so 1.1.01 can't pass for 1.1.0.
          if [[ $out != "wineo $VERSION" ]]; then
            echo "::error::expected 'wineo $VERSION', got '$out'"
            exit 1
          fi

      # The script keeps the GUI in a throwaway HOME with no display but a
      # private Xvfb, and passes only if it is still running after ten
      # seconds.
      - name: wineo-gui starts under Xvfb
        run: |
          scripts/check-gui-starts.sh "$PWD/dist/wineo-$VERSION-x86_64-linux/usr/bin/wineo-gui"

      # Installs the way a user would, into a prefix that isn't on any PATH,
      # then removes it again. Uninstall must leave no file behind.
      - name: install.sh installs and uninstalls
        run: |
          dir=$PWD/dist/wineo-$VERSION-x86_64-linux
          prefix=$(mktemp -d)/prefix
          "$dir/install.sh" "$prefix"
          scripts/check-installed.sh "$prefix" "$prefix/share/licenses/wineo"
          out=$("$prefix/bin/wineo" --version)
          echo "$out"
          # The whole line, so 1.1.01 can't pass for 1.1.0.
          if [[ $out != "wineo $VERSION" ]]; then
            echo "::error::expected 'wineo $VERSION', got '$out'"
            exit 1
          fi
          exec_line=$(grep '^Exec=' "$prefix/share/applications/wineo-gui.desktop")
          echo "$exec_line"
          if [[ $exec_line != "Exec=$prefix/bin/wineo-gui" ]]; then
            echo "::error::the desktop entry's Exec is not the absolute path"
            exit 1
          fi
          "$dir/install.sh" --uninstall "$prefix"
          left=$(find "$prefix" -type f)
          if [[ -n $left ]]; then
            echo "::error::uninstall left files behind:"
            echo "$left"
            exit 1
          fi

  # The deb in fresh Ubuntu and Debian images. The package goes in alone
  # first, with no recommends, so its Depends are what pulls the libraries;
  # Xvfb comes after so it can't hide a missing one from the version check.
  verify-deb:
    needs: build
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    env:
      VERSION: ${{ needs.build.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:22.04', 'debian:12']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: dist

      # Ubuntu's minimal images tell dpkg to skip /usr/share/man and
      # /usr/share/doc, which would hide missing man pages and copyright.
      - name: Install the deb
        run: |
          rm -f /etc/dpkg/dpkg.cfg.d/excludes
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y \
            "./dist/wineo_${VERSION}_amd64.deb"

      - name: wineo --version runs
        run: |
          out=$(wineo --version)
          echo "$out"
          # The whole line, so 1.1.01 can't pass for 1.1.0.
          if [[ $out != "wineo $VERSION" ]]; then
            echo "::error::expected 'wineo $VERSION', got '$out'"
            exit 1
          fi

      - name: Install Xvfb
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y \
            xvfb xauth

      - name: wineo-gui starts under Xvfb
        run: scripts/check-gui-starts.sh /usr/bin/wineo-gui

      - name: Files are at their installed paths
        run: |
          scripts/check-installed.sh /usr /usr/share/doc/wineo
          test -f /usr/share/doc/wineo/copyright

      - name: Removal leaves no files behind
        run: |
          dpkg -L wineo | while read -r path; do
            if [[ -f $path || -L $path ]]; then echo "$path"; fi
          done > files.txt
          echo "$(wc -l < files.txt) installed files"
          if [[ ! -s files.txt ]]; then
            echo "::error::dpkg lists no files for wineo"
            exit 1
          fi
          apt-get remove -y wineo
          left=$(while read -r path; do
            if [[ -e $path || -L $path ]]; then echo "$path"; fi
          done < files.txt)
          if [[ -n $left ]]; then
            echo "::error::removal left files behind:"
            echo "$left"
            exit 1
          fi

  # The rpm in a fresh Fedora image, the same way: weak dependencies off and
  # the package alone first, Xvfb after.
  verify-rpm:
    needs: build
    runs-on: ubuntu-latest
    container: fedora:latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: dist

      - name: Install the rpm
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            "./dist/wineo-${VERSION}-1.x86_64.rpm"

      - name: wineo --version runs
        run: |
          out=$(wineo --version)
          echo "$out"
          # The whole line, so 1.1.01 can't pass for 1.1.0.
          if [[ $out != "wineo $VERSION" ]]; then
            echo "::error::expected 'wineo $VERSION', got '$out'"
            exit 1
          fi

      - name: Install Xvfb
        run: dnf install -y --setopt=install_weak_deps=False xorg-x11-server-Xvfb xauth

      - name: wineo-gui starts under Xvfb
        run: scripts/check-gui-starts.sh /usr/bin/wineo-gui

      - name: Files are at their installed paths
        run: scripts/check-installed.sh /usr /usr/share/licenses/wineo

      - name: Removal leaves no files behind
        run: |
          rpm -ql wineo | while read -r path; do
            if [[ -f $path || -L $path ]]; then echo "$path"; fi
          done > files.txt
          echo "$(wc -l < files.txt) installed files"
          if [[ ! -s files.txt ]]; then
            echo "::error::rpm lists no files for wineo"
            exit 1
          fi
          dnf remove -y wineo
          left=$(while read -r path; do
            if [[ -e $path || -L $path ]]; then echo "$path"; fi
          done < files.txt)
          if [[ -n $left ]]; then
            echo "::error::removal left files behind:"
            echo "$left"
            exit 1
          fi

  # Systems older than glibc 2.35 must refuse the packages. Each check wants
  # the refusal to name the glibc requirement, so a missing graphics library
  # can't make it pass for the wrong reason. focal (glibc 2.31) is past
  # standard support but its archive still resolves.
  verify-deb-refusal:
    needs: build
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    env:
      VERSION: ${{ needs.build.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: dist

      - name: apt refuses the deb over glibc
        run: |
          apt-get update
          if out=$(DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y \
            "./dist/wineo_${VERSION}_amd64.deb" 2>&1); then
            echo "$out"
            echo "::error::apt installed the deb on a system with glibc 2.31"
            exit 1
          fi
          echo "$out"
          if ! grep -qF 'libc6 (>= 2.35)' <<<"$out"; then
            echo "::error::apt refused the deb, but not over libc6 (>= 2.35)"
            exit 1
          fi

  # Rocky Linux 9 ships glibc 2.34. rockylinux/rockylinux is the image Rocky
  # publishes itself; the Docker official rockylinux image has gone stale.
  verify-rpm-refusal:
    needs: build
    runs-on: ubuntu-latest
    container: rockylinux/rockylinux:9
    env:
      VERSION: ${{ needs.build.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: dist

      - name: rpm refuses the rpm over glibc
        run: |
          if out=$(rpm -i --test "./dist/wineo-${VERSION}-1.x86_64.rpm" 2>&1); then
            echo "$out"
            echo "::error::rpm accepted the package on a system with glibc 2.34"
            exit 1
          fi
          echo "$out"
          if ! grep -qF 'glibc >= 2.35' <<<"$out"; then
            echo "::error::rpm refused the package, but not over glibc >= 2.35"
            exit 1
          fi

  publish:
    if: github.event_name == 'push'
    needs:
      - verify
      - verify-deb
      - verify-rpm
      - verify-deb-refusal
      - verify-rpm-refusal
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      # First, so no Release is built from files that changed after the
      # build wrote their checksums. The listing must also name all four
      # assets, or one of them would go out unchecked.
      - name: Check the checksums
        run: |
          version=${GITHUB_REF_NAME#v}
          cd dist
          # --strict fails on a malformed line instead of skipping it.
          sha256sum --strict -c SHA256SUMS
          listed=$(awk '{print $2}' SHA256SUMS | sort)
          expected=$(printf '%s\n' \
            "wineo-$version-x86_64-linux.tar.gz" \
            "wineo_${version}_amd64.deb" \
            "wineo-${version}-1.x86_64.rpm" \
            "wineo-$version-vendored.tar.xz" | sort)
          if [[ $listed != "$expected" ]]; then
            echo "::error::SHA256SUMS does not list exactly the four assets:"
            echo "$listed"
            exit 1
          fi

      - name: Fetch the tag object
        run: |
          git fetch --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "+${GITHUB_REF}:${GITHUB_REF}"

      - name: Write the release notes
        run: |
          version=${GITHUB_REF_NAME#v}
          scripts/changelog-section.sh "$version" > notes.md
          if [[ ! -s notes.md ]]; then
            echo "::error::the CHANGELOG.md section for $version is empty"
            exit 1
          fi
          # Assigned first so a failing script stops the step.
          ubuntu=$(scripts/readme-runtime-packages.sh | tr '\n' ' ')
          fedora=$(scripts/readme-runtime-packages.sh --list fedora | tr '\n' ' ')
          {
            echo
            echo '## Runtime packages'
            echo
            echo 'On Ubuntu 22.04 or newer, install:'
            echo
            echo '```'
            echo "sudo apt install $ubuntu"
            echo '```'
            echo
            echo 'On Fedora, install:'
            echo
            echo '```'
            echo "sudo dnf install $fedora"
            echo '```'
            echo
            echo 'The deb and rpm install these automatically.'
          } >> notes.md

      # Last on purpose: a rerun can come long after the checks passed, and
      # another release may have landed in between, so the guard runs as
      # close to creating the Release as possible to keep that window small.
      - name: Release guard
        run: scripts/release-guard.sh

      - name: Publish the release
        run: |
          version=${GITHUB_REF_NAME#v}
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "Wineo $version" \
            --notes-file notes.md \
            "dist/wineo-$version-x86_64-linux.tar.gz" \
            "dist/wineo_${version}_amd64.deb" \
            "dist/wineo-${version}-1.x86_64.rpm" \
            "dist/wineo-$version-vendored.tar.xz" \
            dist/SHA256SUMS
