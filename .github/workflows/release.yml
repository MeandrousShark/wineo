name: Release

# Tag filters are globs, so v* only narrows things down. The real check is
# scripts/release-guard.sh, which runs in the guard job and again right
# before publish creates the Release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  guard:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The checkout can replace an annotated tag with a lightweight one
      # that points at the same commit, which would fail the guard's
      # annotated check on every run. Fetch the real tag object again.
      - name: Fetch the tag object
        run: |
          git fetch --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "+${GITHUB_REF}:${GITHUB_REF}"

      - name: Release guard
        run: scripts/release-guard.sh

  check:
    needs: guard
    uses: ./.github/workflows/ci.yml

  build:
    needs: check
    runs-on: ubuntu-latest
    # Built on Ubuntu 22.04 (glibc 2.35) so the binaries run there and on
    # anything newer, whatever label GitHub's runners carry later.
    container: ubuntu:22.04
    defaults:
      run:
        shell: bash
    steps:
      # Only a C compiler and pkg-config: the windowing and graphics crates
      # load their libraries at runtime, so no -dev packages are needed.
      # liblzma-dev is left out on purpose, so lzma-sys compiles its own
      # copy and the binary has no liblzma runtime dependency.
      # xz-utils is for the vendored source tarball.
      - name: Install build packages
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y \
            build-essential ca-certificates curl git pkg-config xz-utils

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
            sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build
        run: cargo build --release --locked -p wineo-cli -p wineo-gui

      - name: Pack
        run: |
          version=${GITHUB_REF_NAME#v}
          scripts/pack-tarball.sh "$version" target/release dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tarball
          path: dist/*.tar.gz
          if-no-files-found: error

      # nfpm is pinned and checked against its SHA-256 in fetch-nfpm.sh.
      - name: Pack the deb and rpm
        run: |
          version=${GITHUB_REF_NAME#v}
          scripts/fetch-nfpm.sh "$RUNNER_TEMP/nfpm"
          NFPM=$RUNNER_TEMP/nfpm/nfpm scripts/pack-packages.sh "$version" target/release dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-packages
          path: |
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

      # The checkout is owned by another user than the one in this container,
      # so git refuses to read it until the directory is marked safe. The
      # default shallow checkout already has the commit being built.
      - name: Pack the vendored source
        run: |
          version=${GITHUB_REF_NAME#v}
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          scripts/pack-vendored.sh "$version" "$GITHUB_SHA" dist

      # An empty CARGO_HOME, so the metadata can only resolve from the
      # vendored sources.
      - name: Check the vendored source is complete
        run: |
          version=${GITHUB_REF_NAME#v}
          check=$(mktemp -d)
          mkdir "$check/cargo-home"
          tar -xJf "dist/wineo-$version-vendored.tar.xz" -C "$check"
          cd "$check/wineo-$version"
          CARGO_HOME=$check/cargo-home cargo metadata --format-version 1 --frozen >/dev/null
          cd "$GITHUB_WORKSPACE"
          rm -rf "${check:?}"

      - name: Write the checksums
        run: scripts/write-checksums.sh dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-source
          path: dist/*-vendored.tar.xz
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-checksums
          path: dist/SHA256SUMS
          if-no-files-found: error

  verify:
    needs: build
    runs-on: ubuntu-latest
    # A fresh image with only the documented runtime packages, so a library
    # the build machine had but a user won't is caught here.
    container: ubuntu:22.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-tarball
          path: dist

      # The runtime list comes from the README's marked block, so the
      # README and this job can't disagree. xvfb and xauth run the GUI and
      # binutils provides objdump; they are test tools, not runtime needs.
      # Recommended packages stay out so a missing library isn't hidden.
      - name: Install runtime packages and test tools
        run: |
          # Assigned first so a failing script stops the step.
          list=$(scripts/readme-runtime-packages.sh)
          mapfile -t runtime <<<"$list"
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y \
            "${runtime[@]}" xvfb xauth binutils

      - name: Unpack
        run: |
          version=${GITHUB_REF_NAME#v}
          tar -xzf "dist/wineo-$version-x86_64-linux.tar.gz" -C dist

      - name: Linked libraries are all found
        run: |
          version=${GITHUB_REF_NAME#v}
          for bin in wineo wineo-gui; do
            out=$(ldd "dist/wineo-$version-x86_64-linux/usr/bin/$bin")
            echo "$out"
            if grep -q 'not found' <<<"$out"; then
              echo "::error::$bin links a library that is not installed"
              exit 1
            fi
          done

      - name: No glibc newer than 2.35
        run: |
          version=${GITHUB_REF_NAME#v}
          highest=$(
            for bin in wineo wineo-gui; do
              objdump -T "dist/wineo-$version-x86_64-linux/usr/bin/$bin"
            done | grep -o 'GLIBC_[0-9][0-9.]*' | sed 's/^GLIBC_//' | sort -Vu | tail -n 1
          )
          echo "highest glibc symbol version: ${highest:-none}"
          if [[ -n $highest && $(printf '%s\n' "$highest" 2.35 | sort -V | tail -n 1) != 2.35 ]]; then
            echo "::error::a binary needs glibc $highest, newer than 2.35"
            exit 1
          fi

      - name: wineo --version runs
        run: |
          version=${GITHUB_REF_NAME#v}
          out=$("dist/wineo-$version-x86_64-linux/usr/bin/wineo" --version)
          echo "$out"
          grep -qF "$version" <<<"$out"

      # Exit 124 from timeout means the app was still running when the time
      # ran out. Any other exit, or a panic in the output, is a failure.
      # Everything lives in a throwaway HOME and XDG tree, with no display
      # but the private Xvfb. iced loads X11, xkbcommon, and graphics
      # libraries at runtime, which ldd can't see; the software renderer is
      # forced because the container has no GPU.
      - name: wineo-gui starts under Xvfb
        run: |
          version=${GITHUB_REF_NAME#v}
          gui=$PWD/dist/wineo-$version-x86_64-linux/usr/bin/wineo-gui
          home=$(mktemp -d)
          mkdir -p "$home"/{config,data,state,cache,run}
          chmod 700 "$home/run"
          log=$home/gui.log
          unset DISPLAY WAYLAND_DISPLAY XAUTHORITY DBUS_SESSION_BUS_ADDRESS
          export HOME=$home XDG_CONFIG_HOME=$home/config XDG_DATA_HOME=$home/data \
            XDG_STATE_HOME=$home/state XDG_CACHE_HOME=$home/cache \
            XDG_RUNTIME_DIR=$home/run ICED_BACKEND=tiny-skia
          set +e
          xvfb-run -a -s '-screen 0 1280x800x24' timeout 10 "$gui" >"$log" 2>&1
          status=$?
          set -e
          cat "$log"
          if [[ $status -ne 124 ]]; then
            echo "::error::wineo-gui exited with status $status instead of staying up"
            exit 1
          fi
          if grep -qi 'panic' "$log"; then
            echo "::error::wineo-gui panicked"
            exit 1
          fi

      # Installs the way a user would, into a prefix that isn't on any PATH,
      # then removes it again. Uninstall must leave no file behind.
      - name: install.sh installs and uninstalls
        run: |
          version=${GITHUB_REF_NAME#v}
          dir=$PWD/dist/wineo-$version-x86_64-linux
          prefix=$(mktemp -d)/prefix
          "$dir/install.sh" "$prefix"
          out=$("$prefix/bin/wineo" --version)
          echo "$out"
          grep -qF "$version" <<<"$out"
          exec_line=$(grep '^Exec=' "$prefix/share/applications/wineo-gui.desktop")
          echo "$exec_line"
          if [[ $exec_line != "Exec=$prefix/bin/wineo-gui" ]]; then
            echo "::error::the desktop entry's Exec is not the absolute path"
            exit 1
          fi
          "$dir/install.sh" --uninstall "$prefix"
          left=$(find "$prefix" -type f)
          if [[ -n $left ]]; then
            echo "::error::uninstall left files behind:"
            echo "$left"
            exit 1
          fi

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the tag object
        run: |
          git fetch --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "+${GITHUB_REF}:${GITHUB_REF}"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-tarball
          path: dist

      - name: Write the release notes
        run: |
          version=${GITHUB_REF_NAME#v}
          scripts/changelog-section.sh "$version" > notes.md
          if [[ ! -s notes.md ]]; then
            echo "::error::the CHANGELOG.md section for $version is empty"
            exit 1
          fi
          {
            echo
            echo '## Runtime packages'
            echo
            echo 'On Ubuntu 22.04 or newer, install:'
            echo
            echo '```'
            echo "sudo apt install $(scripts/readme-runtime-packages.sh | tr '\n' ' ')"
            echo '```'
          } >> notes.md

      # Last on purpose: a rerun can come long after the checks passed, and
      # another release may have landed in between, so the guard runs as
      # close to creating the Release as possible to keep that window small.
      - name: Release guard
        run: scripts/release-guard.sh

      - name: Publish the release
        run: |
          version=${GITHUB_REF_NAME#v}
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "Wineo $version" \
            --notes-file notes.md \
            "dist/wineo-$version-x86_64-linux.tar.gz"
