name: CI

# Never on push: the Gitea mirror pushes every branch, and the release
# workflow reuses this one through workflow_call. The schedule runs only the
# advisory check.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The graphics and windowing crates (wayland-sys, x11-dl, tiny-xlib,
      # xkbcommon-dl, khronos-egl, ash, x11rb) load their libraries with
      # dlopen, and secret-service uses its pure-Rust crypto, so the build
      # links no -dev library. What it does need is a C compiler (ring,
      # zstd-sys, and a vendored lzma-sys), which the runner already has,
      # and pkg-config, which build scripts probe for liblzma and the X11
      # library directories.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pkg-config

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal \
            --component rustfmt --component clippy
          rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (release)
        run: cargo clippy --release --workspace -- -D warnings

      - name: Test
        env:
          TERM: xterm-256color
        run: cargo test --workspace --locked --no-fail-fast

  # The release guard only runs on tags, so its tests run here to keep it
  # from breaking unnoticed between releases.
  scripts:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Shellcheck
        run: |
          shellcheck scripts/*.sh packaging/tarball/*.sh
          shellcheck --shell=bash PKGBUILD packaging/aur/*/PKGBUILD

      - name: Release guard tests
        run: scripts/test-release-guard.sh

      - name: Stage install tests
        run: scripts/test-stage-install.sh

      - name: Tarball tests
        run: scripts/test-tarball.sh

      # dpkg-deb comes with the runner. The rpm checks need rpm, and the
      # package build needs the pinned nfpm.
      - name: Package tests
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y rpm
          scripts/fetch-nfpm.sh "$RUNNER_TEMP/nfpm"
          NFPM=$RUNNER_TEMP/nfpm/nfpm scripts/test-packages.sh

      # cargo comes with the runner. The vendoring tests skip themselves, and
      # say so, if it is ever missing.
      - name: Vendored source and checksum tests
        run: scripts/test-vendored.sh

      - name: Release check script tests
        run: scripts/test-checks.sh

      - name: AUR recipe tests
        run: scripts/test-aur.sh

      # rust-floor.sh reads the locked crates offline.
      - name: Gentoo ebuild tests
        run: |
          cargo fetch --locked
          scripts/test-gentoo.sh

      - name: Repository recipe tests
        run: scripts/test-repo-recipes.sh

      # Stubs stand in for gh, podman, makepkg, and every service.
      - name: Publish script tests
        run: scripts/test-publish.sh

  # Advisories appear against code that hasn't changed, so this runs weekly as
  # well. The release workflow reuses this one, so a failure stops a release.
  # The license check keeps the vendored crates acceptable to the package
  # repositories (see deny.toml).
  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check dependency advisories and licenses
        run: |
          scripts/fetch-cargo-deny.sh "$RUNNER_TEMP/cargo-deny"
          "$RUNNER_TEMP/cargo-deny/cargo-deny" --locked check advisories licenses
