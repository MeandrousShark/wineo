name: Bug report
description: Something in wineo doesn't work the way it should.
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: wineo version
      description: The output of `wineo --version`.
      placeholder: wineo 1.1.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - Ubuntu PPA
        - Fedora COPR
        - openSUSE OBS repository
        - Gentoo overlay
        - .deb from a release
        - .rpm from a release
        - Release tarball
        - Arch PKGBUILD (wineo-git)
        - Built from source
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distro and version
      placeholder: Ubuntu 24.04
    validations:
      required: true
  - type: dropdown
    id: program
    attributes:
      label: Where does it happen?
      options:
        - Terminal (wineo)
        - Desktop app (wineo-gui)
        - Both
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: App or game
      description: If this is about something you run in wineo, what is it, and which Wine or Proton version does it use?
      placeholder: GIMP on Wine 11.0
  - type: textarea
    id: happened
    attributes:
      label: What happened?
      description: Include any error message as text.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `wineo new example`
        2. ...
    validations:
      required: true
  - type: textarea
    id: validate
    attributes:
      label: wineo validate
      description: The output of `wineo validate`. Remove anything you'd rather keep private, such as paths.
      render: text
