[package]
name = "wineo-gog"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# Lets other crates' tests point a client at a plain HTTP fake server in
# release builds too, and use the fake servers in `fake`. Only ever enabled
# from dev-dependencies.
test-server = []

[dependencies]
flate2.workspace = true
md-5.workspace = true
reqwest.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
# For a test's name resolver that blocks the way the system's does.
tokio = { version = "1", features = ["rt"] }

[lints]
workspace = true
