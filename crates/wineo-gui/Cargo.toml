[package]
name = "wineo-gui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "wineo-gui"
path = "src/main.rs"

[dependencies]
wineo-core.workspace = true
anyhow.workspace = true
sha2.workspace = true
tempfile.workspace = true
jiff.workspace = true
iced = { version = "0.14", features = ["image-without-codecs", "svg", "tokio", "advanced"] }
image = { workspace = true, features = ["webp", "gif"] }
resvg = "0.45"
unicode-segmentation = "1.13.3"
tokio = { version = "1", features = ["rt", "sync", "time"] }
ashpd = { version = "0.12.3", default-features = false, features = ["tokio"] }

[dev-dependencies]
flate2.workspace = true
serde_json.workspace = true
tar.workspace = true
zip.workspace = true
wineo-core = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
