[workspace]
resolver = "3"
members = ["crates/wineo-core", "crates/wineo-cli", "crates/wineo-gui"]

[workspace.package]
version = "0.23.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
wineo-core = { path = "crates/wineo-core" }
anstream = "1.0"
anstyle = "1.0"
anyhow = "1"
filetime = "0.2"
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
xz2 = "0.1"
zstd = "0.13"
clap = { version = "4.6", features = ["derive"] }
dbus-secret-service = { version = "4.1", features = ["crypto-rust"] }
clap_complete = { version = "4.6", features = ["unstable-dynamic"] }
clap_mangen = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico"] }
jiff = { version = "0.2", features = ["serde"] }
rustix = { version = "1.1", features = ["event", "fs", "process", "stdio"] }
rustyline = { version = "18", default-features = false, features = ["custom-bindings"] }
serde = { version = "1", features = ["derive"] }
signal-hook = "0.4"
tempfile = "3"
thiserror = "2"
toml = "1.1"
toml_edit = "0.25"

[workspace.lints.rust]
unsafe_code = "forbid"

# makepkg strips the package anyway, so local release builds match it.
[profile.release]
strip = "symbols"
