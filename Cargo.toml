[workspace]
resolver = "3"
members = ["crates/wineo-core", "crates/wineo-cli", "crates/wineo-gog", "crates/wineo-gui"]

[workspace.package]
version = "0.32.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
wineo-core = { path = "crates/wineo-core" }
wineo-gog = { path = "crates/wineo-gog" }
anstream = "1.0"
anstyle = "1.0"
anyhow = "1"
filetime = "0.2"
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
xz2 = "0.1"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
zstd = "0.13"
clap = { version = "4.6", features = ["derive"] }
clap_complete = { version = "4.6", features = ["unstable-dynamic"] }
clap_mangen = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico"] }
md-5 = "0.10"
jiff = { version = "0.2", features = ["serde"] }
rustix = { version = "1.1", features = ["event", "fs", "param", "process", "stdio"] }
rustyline = { version = "18", default-features = false, features = ["custom-bindings"] }
secret-service = { version = "5.2", default-features = false, features = ["rt-tokio-crypto-rust"] }
serde = { version = "1", features = ["derive"] }
signal-hook = "0.4"
tempfile = "3"
thiserror = "2"
toml = "1.1"
toml_edit = "0.25"
# Each keyring call runs on its own current-thread runtime.
tokio = { version = "1", features = ["rt", "net", "time"] }
unicode-width = "0.2"
# Only for matching the errors secret-service passes through.
zbus = { version = "5", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

# makepkg strips the package anyway, so local release builds match it.
[profile.release]
strip = "symbols"
# Smallest binaries and lowest memory of the options measured in plan 0051.
lto = "fat"
codegen-units = 1
