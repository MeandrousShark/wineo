[workspace]
resolver = "3"
members = ["crates/wineo-core", "crates/wineo-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
wineo-core = { path = "crates/wineo-core" }
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
jiff = { version = "0.2", features = ["serde"] }
rustix = { version = "1.1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
signal-hook = "0.4"
tempfile = "3"
thiserror = "2"
toml = "1.1"
toml_edit = "0.25"

[workspace.lints.rust]
unsafe_code = "forbid"
