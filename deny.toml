# Read by `cargo deny check advisories licenses`, which runs in CI and blocks
# a release when a dependency has a known vulnerability or a license the
# package repositories can't take.

[graph]
# No `targets`: the vendored source tarball carries every platform's crates,
# so both checks look at all of them.
all-features = true

[advisories]
# Only direct dependencies fail. The unmaintained crates today arrive through
# iced and zbus, so there's nothing here to replace.
unmaintained = "workspace"
# Each accepted advisory goes here as { id = "...", reason = "..." }.
ignore = []

[licenses]
# Only licenses that OBS (OSI approved), Launchpad (OSI, FSF, or DFSG
# approved), and Fedora's allowed list all accept, plus wineo's own. cargo-deny
# reads "OR" in a crate's license, so a crate that offers a choice only needs
# one of them here; that is why Apache-2.0 WITH LLVM-exception isn't listed.
# 0BSD is here for the patched copy of hexf-parse in third_party/, which has
# no choice to offer. Unlicense is here for ksni, the tray icon, which has
# none either: OSI approved it on 2020-06-12
# (https://opensource.org/license/unlicense), and Fedora's license data
# (fedora-license-data 1.76) lists it as allowed. A new entry needs all three
# policies checked first, not just the list.
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
